version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:22.0

    steps:
      - checkout

      - run:
          name: Check HTML
          command: |
            echo "Checking HTML..."
            test -f app/page.html
            echo "HTML file found!"
      - run:
          name: Start Web Server
          command: |
            cd app
            python3 -m http.server 8080 -directory ./app
          background: true

workflows:
  test:
    jobs:
      - test