version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.2

jobs:
  test:
    docker:
      - image: cimg/node:lts-browsers

    steps:
      - checkout

      - run:
          name: Install Vercel CLI
          command: sudo npm install --global vercel@latest

      - run:
          name: Deploy Vercel preview instance and capture domain
          command: |
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"

            DEPLOYED_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
            FINAL_URL="${DEPLOYED_URL%/}/app?x-vercel-protection-bypass=${TOKEN_BYPASS_TESTIM}"

            echo "Vercel deployment URL: $DEPLOYED_URL"
            echo "Test base URL:         $FINAL_URL"

            echo "DEPLOYED_URL=\"$DEPLOYED_URL\"" >> "$BASH_ENV"
            echo "FINAL_URL=\"$FINAL_URL\"" >> "$BASH_ENV"


      - browser-tools/install_chrome:
          replace_existing: true
          timeout: 5m
      - browser-tools/install_chromedriver:
          timeout: 5m

      - run:
          name: Check Browser and Driver Versions
          command: |
            echo "Oh boy: $FINAL_URL"
            google-chrome --version
            chromedriver --version

      - run:
          name: Run Testim tests with local Chrome
          no_output_timeout: 30m
          command: |
            bash -c 'echo "Oh boy: $FINAL_URL"'
            FINAL_URL="${FINAL_URL:-$(cat /tmp/final_url.txt)}"
            DEPLOYED_URL="${DEPLOYED_URL:-$(cat /tmp/deployed_url.txt)}"

            if [ -z "$FINAL_URL" ]; then
              echo "ERROR: FINAL_URL is empty — deploy step may have failed"
              exit 1
            fi
            echo "Running Testim against: $FINAL_URL"

            npx --yes @testim/testim-cli \
              --token "$TESTIM_TOKEN" \
              --project "$TESTIM_PROJECT_ID" \
              --base-url "$FINAL_URL" \
              --user "Hx4tCRd3BORgYfxVE8Es" \
              --use-local-chrome-driver \
              --mode selenium \
              --headless \
              --branch "master"

      - run:
          name: Destroy Vercel Instance
          command: |
            DEPLOYED_URL="${DEPLOYED_URL:-$(cat /tmp/deployed_url.txt)}"
            echo "Removing Vercel deployment: $DEPLOYED_URL"
            vercel remove "$DEPLOYED_URL" --token="$VERCEL_TOKEN" --yes
          when: always

workflows:
  version: 2
  test:
    jobs:
      - test
