version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.2

jobs:
  test:
    docker:
      - image: cimg/node:26.7.0-browsers
      - image: testimio/docker-cli
    steps:
      - checkout
      # - run: mkdir -p $CIRCLE_TEST_REPORTS/testim/

      - browser-tools/install_browser_tools
      # Install Google Chrome (Required for ChromeDriver)
      - browser-tools/install-chrome:
          timeout: 5m
      
      # Install ChromeDriver
      - browser-tools/install-chromedriver:
          timeout: 5m

      - run:
          name: Check Browser and Driver Versions
          command: |
            google-chrome --version
            chromedriver --version

      - run:
          name: Run Testim tests locally
          no_output_timeout: 30m
          command: |
            npx --yes @testim/testim-cli \
              --token "$TESTIM_TOKEN" \
              --project "$TESTIM_PROJECT_ID" \
              --base-url "https://testim-poc.vercel.app/app" \
              --user "Hx4tCRd3BORgYfxVE8Es" \
              --mode "selenium" \
              --use-local-chrome-driver \
              --branch "master"
workflows:
  version: 2
  test:
    jobs:
      - test